[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge-cli"
version = "0.2.1"
description = "Verified, portable, private project memory for AI coding sessions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Orvantia" }]
keywords = ["ai", "handoff", "context", "claude", "coding-agent"]

[project.scripts]
contextbridge = "contextbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
